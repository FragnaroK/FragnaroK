<svg fill="none" viewBox="0 0 700 140" width="700" height="140" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                :root {
                    --color: 255, 255, 255;
 
                    --brackets-size: 55px;
                    --header-wrapper-padding-y: 5px;
                    --header-wrapper-padding-x: 20px;

                    --animation-duration: 2s; 
                    --animation-timing: cubic-bezier(0.455, 0.03, 0.515, 0.955);
                }

                svg {
                    /* background-color: black; */
                    position: absolute;
                    top: 65%;
                    left: 50%;
                    translate: -50% -50%;
                }

                * {
                    font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
                    color: rgba(var(--color));
                }

                *::before,
                *::after {
                    position: absolute;
                    top: 0;
                    z-index: 99999;
                }

                h1,
                h2,
                h3 {
                    margin: 0;
                    padding: 0;
                    mix-blend-mode: difference;
                    animation: FadeIn .25s ease-in-out both;
                    animation-delay: var(--animation-duration);
                }

                h3 {
                    font-size: small;
                    font-weight: 100;
                    color: rgba(var(--color), 0.6);
                    animation-delay: calc(var(--animation-duration) * 1.1);
                }
                
                .container {
                    display: flex;
                    justify-content: center;
                    align-items: center;
                }

                .header-wrapper {
                    position: relative;
                    width: fit-content;
                    padding: var(--header-wrapper-padding-y) var(--header-wrapper-padding-x);
                    display: flex;
                    flex-direction: column;
                    justify-content: center;
                    align-items: center;
                    overflow: hidden;
                    transform: scale(1.5)
                }

                .header-wrapper::before,
                .header-wrapper::after {
                    font-size: var(--brackets-size);
                    top: 50%;
                    translate: 0 -50%;
                    animation-duration: var(--animation-duration);
                    animation-timing-function: var(--animation-timing);
                    animation-fill-mode: both;
                }

                .header-wrapper::before {
                    content: "[";
                    left: 0;
                    animation-name: Slide2Left;
                }

                .header-wrapper::after {
                    content: "]";
                    right: 0;
                    animation-name: Slide2Right;
                }

                .header-wrapper h1, .header-wrapper h3 {
                    z-index: 99999;
                }

                .progress-bar {
                    position: absolute;
                    top: 63%;
                    translate: 0% 100%;
                    width: 0%;
                    height: 1.5px;
                    background-color: rgba(var(--color));
                    animation: fill-progress-bar var(--animation-duration) var(--animation-timing) both ;
                }

                @keyframes fill-progress-bar {
                    to {
                        width: 90%;
                    }
                }

                @keyframes Slide2Right {
                    from {
                        right: 40%;
                    }
                    to {
                        right: 0;
                    }
                }

                @keyframes Slide2Left {
                    from {
                        left: 40%;
                    }
                    to {
                        left: 0;
                    }
                }

               @keyframes FadeIn {
                    from {
                        opacity: 0;
                    }

                    to {
                        opacity: 1;
                    }
               }

            </style>

            <div class="container">
                <div class="header-wrapper">
                    <div class="progress-bar"></div>
                    <h1>Franco Canalejo</h1>
                    <h3>Web Developer</h3>
                </div>
            </div>
        </div>
    </foreignObject>
</svg>
